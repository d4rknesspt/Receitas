<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card">
      <div class="card-body p-4">
        <h1 class="h4 mb-3">Entrar</h1>

        @if (erro()) {
          <div class="alert alert-danger">{{ erro() }}</div>
        }

        <form [formGroup]="form" (ngSubmit)="entrar()" novalidate>
          <div class="mb-3">
            <label class="form-label" for="email">Email</label>
            <input
              id="email"
              type="email"
              class="form-control"
              formControlName="email"
              [class.is-invalid]="form.controls.email.invalid && form.controls.email.touched"
            />
            <div class="invalid-feedback">
              @if (form.controls.email.errors?.['required']) {
                Indique o email.
              } @else {
                O email não é válido.
              }
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label" for="password">Palavra-passe</label>
            <input
              id="password"
              type="password"
              class="form-control"
              formControlName="password"
              [class.is-invalid]="form.controls.password.invalid && form.controls.password.touched"
            />
            <div class="invalid-feedback">Indique a palavra-passe.</div>
          </div>

          <button type="submit" class="btn btn-primary w-100" [disabled]="aEnviar()">
            Entrar
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
