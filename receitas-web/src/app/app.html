<nav class="navbar navbar-expand navbar-dark navbar-receitas">
  <div class="container">
    <a class="navbar-brand" routerLink="/">Receitas</a>

    <ul class="navbar-nav me-auto">
      <li class="nav-item">
        <a class="nav-link" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Início</a>
      </li>
      @if (auth.autenticado()) {
        <li class="nav-item">
          <a class="nav-link" routerLink="/receitas/nova" routerLinkActive="active">Nova receita</a>
        </li>
      }
      @if (auth.eAdmin()) {
        <li class="nav-item">
          <a class="nav-link" routerLink="/admin" routerLinkActive="active">Administração</a>
        </li>
      }
    </ul>

    <ul class="navbar-nav ms-auto align-items-center">
      @if (auth.autenticado()) {
        <li class="nav-item">
          <span class="navbar-text me-3">Olá, {{ auth.utilizador()?.nome }}</span>
        </li>
        <li class="nav-item">
          <button class="btn btn-outline-light btn-sm" (click)="sair()">Sair</button>
        </li>
      } @else {
        <li class="nav-item">
          <a class="nav-link" routerLink="/login" routerLinkActive="active">Entrar</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/registo" routerLinkActive="active">Registar</a>
        </li>
      }
    </ul>
  </div>
</nav>

<main class="container py-4">
  <router-outlet />
</main>
